<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room of Errors 8 - 환자 배치</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  body{margin:0;font-family:sans-serif}
  #panel{position:fixed;top:8px;left:8px;z-index:10;background:rgba(255,255,255,.92);border-radius:10px;
    padding:10px 12px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.2);width:250px}
  #panel h3{margin:0 0 6px;font-size:15px}
  #panel label{display:block;margin-top:6px}
  #panel input[type=range]{width:100%}
  #panel .v{float:right;font-weight:bold}
  #code{margin-top:8px;background:#f2f4f6;padding:6px;border-radius:6px;font-size:12px;word-break:break-all}
  #toggle{position:fixed;top:8px;right:8px;z-index:11;padding:8px 12px;border:0;border-radius:8px;background:#2f6fb3;color:#fff;font-size:14px}
  #msg{margin-top:6px;color:#b33}
  #toast{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:12;background:rgba(255,255,255,.96);
    padding:10px 14px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:15px;max-width:90%}
</style>
<script>
/* 환자: 모델에 들어 있는 동작(누운 자세)으로 멈춘 뒤, 침대 매트리스 위에 자동으로 눕힘 */
const BED = { x: 0, z: -2.45, top: 0.593 };      // 침대 가운데와 매트리스 윗면 높이
const PILLOW = { z: -3.17, top: 0.713 };        // 베개 위치와 윗면 높이
AFRAME.registerComponent('pose-clip', {
  schema: { time: {type: 'number', default: 11.4} },   // 몇 초 지점의 자세로 멈출지
  init: function () {
    this.el.addEventListener('model-loaded', (e) => {
      this.model = e.detail.model;
      const clips = this.model.animations || [];
      if (clips.length) { this.mixer = new THREE.AnimationMixer(this.model); this.mixer.clipAction(clips[0]).play(); }
      this.apply();
      this.snapToBed();
      document.getElementById('msg').textContent = '';
    });
    this.el.addEventListener('model-error', () => {
      document.getElementById('msg').textContent = '환자 모델(patient.glb)을 불러오지 못했어요.';
    });
  },
  update: function () { this.apply(); },
  apply: function () { if (this.mixer) this.mixer.setTime(this.data.time); },
  boneBox: function () {        // 뼈대(관절) 위치로 몸이 차지하는 범위를 계산
    const box = new THREE.Box3(), v = new THREE.Vector3();
    this.el.object3D.updateMatrixWorld(true);
    this.model.traverse(o => { if (o.isBone) box.expandByPoint(o.getWorldPosition(v)); });
    return box;
  },
  bonePos: function (n) {
    const o = this.model.getObjectByName('mixamorig' + n) || this.model.getObjectByName('mixamorig:' + n);
    return o ? o.getWorldPosition(new THREE.Vector3()) : null;
  },
  snapToBed: function () {
    const m = this.model, upd = () => this.el.object3D.updateMatrixWorld(true), B = n => this.bonePos(n);
    m.rotation.set(0, 0, 0); upd();
    let box = this.boneBox();
    if (box.max.y - box.min.y > 1.0) {
      m.rotation.x = -Math.PI / 2; upd();     // 동작이 적용되지 않아 서 있는 자세라면 → 등을 대고 눕힘
    } else {
      // ① 몸 방향: 발 → 머리 방향이 베개(-z) 쪽을 향하도록
      const feetMid = () => B('LeftFoot').add(B('RightFoot')).multiplyScalar(0.5);
      let head = B('Head'), feet = feetMid();
      m.rotation.y = Math.PI - Math.atan2(head.x - feet.x, head.z - feet.z); upd();
      // ② 상체 기울기: 머리 관절이 엉덩이보다 약 8cm 높게 (베개 벤 높이)
      let best = 0, bestErr = 1e9;
      for (let deg = -45; deg <= 15; deg += 0.5) {
        m.rotation.x = deg * Math.PI / 180; upd();
        const err = Math.abs((B('Head').y - B('Hips').y) - 0.08);
        if (err < bestErr) { bestErr = err; best = m.rotation.x; }
      }
      m.rotation.x = best; upd();
      // ③ 다리: 허벅지 관절을 돌려 발이 매트리스에 닿도록 (엉덩이보다 약 4cm 낮게)
      const X = new THREE.Vector3(1, 0, 0);
      ['Left', 'Right'].forEach(side => {
        const leg = this.model.getObjectByName('mixamorig' + side + 'UpLeg') || this.model.getObjectByName('mixamorig:' + side + 'UpLeg');
        if (!leg) return;
        const q0 = leg.quaternion.clone(); let bestA = 0, bestE = 1e9;
        for (let deg = -40; deg <= 40; deg += 1) {
          leg.quaternion.copy(q0); this.rotWorld(leg, X, deg * Math.PI / 180); upd();
          const e = Math.abs(B(side + 'Foot').y - (B('Hips').y - 0.04));
          if (e < bestE) { bestE = e; bestA = deg; }
        }
        leg.quaternion.copy(q0); this.rotWorld(leg, X, bestA * Math.PI / 180); upd();
      });
    }
    // ④ 위치: 엉덩이는 매트리스 위, 머리는 베개 위
    const hips = B('Hips'), head = B('Head'), p = this.el.object3D.position;
    const x = p.x + BED.x - (hips.x + head.x) / 2,
          z = p.z + PILLOW.z - head.z,
          y = p.y + (BED.top + 0.11) - hips.y;     // 엉덩이 관절이 매트리스보다 약 11cm 위 (몸 두께)
    this.el.setAttribute('position', {x: +x.toFixed(3), y: +y.toFixed(3), z: +z.toFixed(3)});
    if (window.onPatientPlaced) window.onPatientPlaced();
  },
  rotWorld: function (bone, axis, ang) {   // 관절을 세계 기준 축으로 돌림
    const pq = new THREE.Quaternion(); bone.parent.getWorldQuaternion(pq);
    const d = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    bone.quaternion.premultiply(pq.clone().invert().multiply(d).multiply(pq));
  }
});

/* 침대 난간: 환자 기준 오른쪽(수액폴대 쪽) 난간은 내리고, 왼쪽 난간은 올라온 게 잘 보이게 높임.
   rightDown: true = 내려감 / false = 올라감 (원래 모델 상태) */
AFRAME.registerComponent('bed-rails', {
  schema: { rightDown: {default: true}, leftUp: {default: true} },
  init: function () {
    this.el.addEventListener('model-loaded', () => { this.ready = true; this.update(); });
  },
  update: function () {
    if (!this.ready) return;
    this.el.getObject3D('mesh').traverse(o => {
      if (!o.isMesh) return;
      const pos = o.geometry.attributes.position;
      if (!this.orig) this.orig = pos.array.slice();
      for (let i = 0; i < pos.count; i++) {
        const x = this.orig[i*3], y = this.orig[i*3+1], z = this.orig[i*3+2];
        // 모델 기준 -z 쪽 = 환자 오른쪽. 매트리스보다 위에 있는 난간 부분만 아래로 0.22 이동
        const isRightRail = z < -0.25 && Math.abs(x) < 0.8 && y > 0.18;
        const isLeftRail  = z >  0.25 && Math.abs(x) < 0.8 && y > 0.17;   // 모델 기준 +z 쪽 = 환자 왼쪽
        let ny = y;
        if (this.data.rightDown && isRightRail) ny = y - 0.22;        // 오른쪽: 내림
        if (this.data.leftUp && isLeftRail) ny = y + 0.12;            // 왼쪽: 확실히 올라온 높이로 (매트리스 위 약 30cm)
        pos.array[i*3+1] = ny;
      }
      pos.needsUpdate = true; o.geometry.computeBoundingBox(); o.geometry.computeBoundingSphere();
    });
  }
});

/* 병원 베갯잇: 흰 바탕에 작은 CAU 글씨를 엇갈리게 반복 */
AFRAME.registerComponent('pillowcase', {
  init: function () {
    const N = 512, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const c = cv.getContext('2d');
    c.fillStyle = '#fbfbfa'; c.fillRect(0, 0, N, N);
    c.fillStyle = '#6f93b8'; c.font = 'bold 26px sans-serif'; c.textAlign = 'center';
    for (let r = 0; r < 8; r++) for (let k = 0; k < 6; k++)
      c.fillText('CAU', (k + (r % 2 ? 0.5 : 0)) * (N / 6) + 20, r * (N / 8) + 40);
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(3, 1.5);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    this.mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 });
  },
  tick: function () {
    const mesh = this.el.getObject3D('mesh');
    if (mesh && mesh.material !== this.mat) mesh.material = this.mat;
  }
});

/* 고리에 걸기: 모델이 불러와지면 맨 윗부분 가운데가 지정한 고리 위치에 오도록 자리를 잡음 */
AFRAME.registerComponent('hang-on', {
  schema: { type: 'vec3' },   // 고리 위치 (x y z)
  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const o = this.el.object3D; o.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(this.el.getObject3D('mesh'));
      const h = this.data, p = o.position;
      this.el.setAttribute('position', {
        x: +(p.x + h.x - (box.min.x + box.max.x) / 2).toFixed(3),
        y: +(p.y + h.y - box.max.y).toFixed(3),
        z: +(p.z + h.z - (box.min.z + box.max.z) / 2).toFixed(3) });
    });
  }
});

/* 수액 세트: 수액백 → 인퓨전펌프 → 3-way ← PCA 라인, 3-way에서 합쳐져 환자 오른팔(아래팔~손등)로 들어감.
   3-way 손잡이가 가리키는 포트가 막힌 쪽(OFF).
   pcaClosed: true  → 손잡이가 PCA 포트 쪽 = PCA 차단 (E5 오류)
              false → 손잡이가 빈 쪽 = 세 방향 모두 열림 (정상)
   3-way를 클릭하면 손잡이를 돌려 교정함 */
AFRAME.registerComponent('iv-set', {
  schema: { bag: {type:'selector'}, pca: {type:'selector'}, patient: {type:'selector'},
            threeway: {type:'selector'}, pump: {type:'selector'}, pcaClosed: {default: true} },
  init: function () {
    const T = THREE;
    this.tubeMat = new T.MeshStandardMaterial({ color:'#f2f6f8', roughness:0.4, transparent:true, opacity:0.85 });
    this.tubes = {}; this.last = ''; this.box = new T.Box3();
    // 3-way 모양: 흰 몸통 + 주 라인 포트 2개(좌우) + PCA 옆 포트 1개 + 파란 손잡이
    const g = new T.Group(), white = new T.MeshStandardMaterial({color:'#ffffff', roughness:0.3}),
          blue = new T.MeshStandardMaterial({color:'#2f6fd6', roughness:0.4});
    g.add(new T.Mesh(new T.CylinderGeometry(0.01,0.01,0.016,16), white));
    const main = new T.Mesh(new T.CylinderGeometry(0.0045,0.0045,0.055,10), white); main.rotation.z = Math.PI/2; g.add(main);
    const side = new T.Mesh(new T.CylinderGeometry(0.0045,0.0045,0.028,10), white); side.rotation.x = Math.PI/2; side.position.z = 0.014; g.add(side);
    this.lever = new T.Mesh(new T.BoxGeometry(0.008,0.005,0.034), blue); this.lever.position.y = 0.011; g.add(this.lever);
    // 클릭이 잘 되도록 보이지 않는 넓은 상자
    const hit = new T.Mesh(new T.BoxGeometry(0.09,0.05,0.07), new T.MeshBasicMaterial({visible:false})); g.add(hit);
    this.data.threeway.setObject3D('mesh', g);
    this.data.threeway.addEventListener('click', () => {
      if (!this.data.pcaClosed) { showMsg('3-way: 세 방향 모두 열려 있어요 (정상).'); return; }
      this.el.setAttribute('iv-set', 'pcaClosed', false);
      showMsg('✔ 오류 발견 · 교정 (E5)<br>3-way가 PCA 쪽으로 잠겨 있었어요 → 손잡이를 돌려 PCA 라인 개방, 통증(NRS) 재사정');
    });
  },
  update: function () {   // 손잡이 방향: PCA 포트 쪽(+z) = PCA 차단 / 반대쪽(-z) = 모두 열림
    if (this.lever) this.lever.position.z = this.data.pcaClosed ? 0.016 : -0.016;
  },
  bottomOf: function (el, out) {
    const o = el.getObject3D('mesh'); if (!o) return false;
    this.box.setFromObject(o);
    out.set((this.box.min.x+this.box.max.x)/2, this.box.min.y, (this.box.min.z+this.box.max.z)/2); return true;
  },
  bone: function (root, n) { return root.getObjectByName('mixamorig'+n) || root.getObjectByName('mixamorig:'+n); },
  tube: function (key, pts) {
    const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, 0.004, 6, false);
    if (this.tubes[key]) { this.tubes[key].geometry.dispose(); this.tubes[key].geometry = geo; }
    else { this.tubes[key] = new THREE.Mesh(geo, this.tubeMat); this.el.sceneEl.object3D.add(this.tubes[key]); }
  },
  tick: function () {
    const V = THREE.Vector3, A = new V(), P = new V(), S = new V(), H = new V();
    if (!this.bottomOf(this.data.bag, A) || !this.bottomOf(this.data.pca, P)) return;
    // 인퓨전펌프: 위쪽 관 끝 = 들어가는 곳, 아래쪽 관 끝 = 나오는 곳 (모델 기준 좌표)
    const pump = this.data.pump; if (!pump.getObject3D('mesh')) return;
    pump.object3D.updateMatrixWorld(true);
    const PIN = pump.object3D.localToWorld(new V(0.238, 0.95, -0.088)), POUT = pump.object3D.localToWorld(new V(0.241, -0.95, 0.078));
    const pt = this.data.patient.getObject3D('mesh'); if (!pt) return;
    const fore = this.bone(pt,'RightForeArm'), hand = this.bone(pt,'RightHand'); if (!fore || !hand) return;
    fore.getWorldPosition(S); hand.getWorldPosition(H); S.lerp(H, 0.7);          // 주입 부위
    const key = [A,P,S,PIN,POUT].map(v => v.toArray().map(x => x.toFixed(3)).join()).join('|');
    if (key === this.last) return; this.last = key;
    // 3-way 위치: 주입 부위에서 수액백 쪽으로 약 20cm, 침대 위 높이
    const dir = new V(POUT.x - S.x, 0, POUT.z - S.z).normalize();
    const W = S.clone().addScaledVector(dir, 0.2); W.y = S.y + 0.01;
    const tw = this.data.threeway.object3D;
    tw.position.copy(W); tw.rotation.set(0, Math.atan2(-dir.z, dir.x), 0); tw.updateMatrixWorld(true);
    const inPort = tw.localToWorld(new V(0.0275,0,0)), outPort = tw.localToWorld(new V(-0.0275,0,0)),
          sidePort = tw.localToWorld(new V(0,0,0.028));
    const sag = (a, b, d) => { const m = a.clone().lerp(b, 0.5); m.y = Math.min(a.y, b.y) - d; return m; };
    this.tube('bag2pump', [A, sag(A, PIN, 0.06), PIN]);              // 수액백 → 인퓨전펌프
    this.tube('main', [POUT, sag(POUT, inPort, 0.15), inPort]);      // 인퓨전펌프 → 3-way
    this.tube('pca',  [P, sag(P, sidePort, 0.2), sidePort]);         // PCA → 3-way 옆 포트
    this.tube('site', [outPort, outPort.clone().lerp(S, 0.5).setY(W.y + 0.01), S]); // 3-way → 오른팔
  }
});
/* 인퓨전펌프 화면: 주입 속도 표시. 클릭하면 처방 속도로 교정 (E4) */
AFRAME.registerComponent('pump-screen', {
  schema: { rate: {default: 20}, order: {default: 80}, fluid: {default: 'Plasma 1L'} },
  init: function () {
    this.cv = document.createElement('canvas'); this.cv.width = 512; this.cv.height = 384;
    this.tex = new THREE.CanvasTexture(this.cv);
    this.mat = new THREE.MeshBasicMaterial({ map: this.tex, side: THREE.DoubleSide });
    this.el.addEventListener('click', () => {
      if (this.data.rate !== this.data.order) {
        const was = this.data.rate;
        this.el.setAttribute('pump-screen', 'rate', this.data.order);
        showMsg('✔ 오류 발견 · 교정 (E4)<br>주입 속도 ' + was + ' mL/hr → 처방 ' + this.data.order + ' mL/hr로 교정, 5 Rights 재확인');
      } else showMsg('인퓨전펌프: ' + this.data.order + ' mL/hr로 주입 중 (처방과 일치).');
    });
  },
  update: function () {   // 화면 그리기
    const c = this.cv.getContext('2d');
    c.fillStyle = '#0b1a12'; c.fillRect(0, 0, 512, 384);
    c.fillStyle = '#7CFFB2';
    c.font = 'bold 40px sans-serif'; c.fillText(this.data.fluid, 22, 52);
    c.font = 'bold 230px sans-serif'; const num = String(this.data.rate); c.fillText(num, 16, 268);   // 숫자 크게
    const w = c.measureText(num).width;
    c.font = 'bold 58px sans-serif'; c.fillText('mL/hr', 16 + w + 10, 268);
    c.font = 'bold 34px sans-serif'; c.fillText('▶ RUNNING', 22, 352);
    this.tex.needsUpdate = true;
  },
  tick: function () {     // 판(plane)에 화면 그림을 입힘
    const mesh = this.el.getObject3D('mesh');
    if (mesh && mesh.material !== this.mat) mesh.material = this.mat;
  }
});
function showMsg(html){
  const m = document.getElementById('toast'); m.innerHTML = html; m.style.display = 'block';
  clearTimeout(showMsg.t); showMsg.t = setTimeout(() => m.style.display = 'none', 6000);
}
</script>
</head>
<body>

<div id="toast"></div>
<div id="views" style="position:fixed;top:48px;right:8px;z-index:11;display:flex;flex-direction:column;gap:6px">
  <button onclick="setView(-2.2,-2.0,-52)" style="padding:7px 10px;border:0;border-radius:8px;background:#fff">폴대 쪽에서 보기</button>
  <button onclick="setView(1.7,-2.5,90)" style="padding:7px 10px;border:0;border-radius:8px;background:#fff">침대 반대편에서 보기</button>
  <button onclick="setView(1.3,-0.4,-90)" style="padding:7px 10px;border:0;border-radius:8px;background:#fff">출입문·손씻기 구역 보기</button>
</div>
<button id="toggle">조절창 숨기기</button>
<div id="panel">
  <h3>위치 조절</h3>
  <label>조절할 물건
    <select id="target" style="width:100%;font-size:14px;margin-top:2px">
      <option value="patient">환자</option>
      <option value="ivpole">수액폴대</option>
      <option value="ivbag">수액백</option>
      <option value="pca">PCA</option>
      <option value="pump">인퓨전펌프</option>
      <option value="sink">세면대</option>
      <option value="sanitizer">손소독제</option>
      <option value="soap">손세정제</option>
      <option value="towel">페이퍼 타월</option>
    </select></label>
  <label>높이 (위·아래) <span class="v" id="vy"></span><input type="range" id="py" min="0" max="1.5" step="0.01"></label>
  <label>앞·뒤 <span class="v" id="vz"></span><input type="range" id="pz" min="-4" max="-1" step="0.01"></label>
  <label>좌·우 <span class="v" id="vx"></span><input type="range" id="px" min="-2" max="2" step="0.01"></label>
  <label>방향 (회전) <span class="v" id="vr"></span><input type="range" id="pr" min="-180" max="180" step="1"></label>
  <label id="lt">자세 (동작 시점, 초) <span class="v" id="vt"></span><input type="range" id="pt" min="0" max="11.4" step="0.1" value="11.4"></label>
  <div id="code"></div>
  <div id="msg">환자 모델 불러오는 중…</div>
</div>

<!-- dracoDecoderPath: 환자 모델의 압축(Draco)을 푸는 설정. 이 줄이 없으면 환자가 안 보여요 -->
<a-scene renderer="antialias:true" cursor="rayOrigin: mouse" raycaster="objects: .clickable"
         gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/"
         background="color:#dfe6ec">

  <!-- 조명 -->
  <a-entity light="type:ambient; intensity:0.8"></a-entity>
  <a-entity light="type:directional; intensity:0.7" position="1 3 1"></a-entity>

  <!-- 병실: 바닥·벽·창문 -->
  <!-- 바닥: 대리석 타일 (60cm 타일, 그림은 코드로 생성) -->
  <a-plane rotation="-90 0 0" width="8" height="8" position="0 0 -2" marble-floor></a-plane>
  <a-plane width="8" height="3" color="#ffffff" position="0 1.5 -4.2"></a-plane>
  <a-plane width="8" height="3" color="#ffffff" position="-3.2 1.5 -2" rotation="0 90 0"></a-plane>
  <a-plane width="8" height="3" color="#ffffff" position="3.2 1.5 -2" rotation="0 -90 0"></a-plane>
  <a-plane width="1.4" height="0.9" color="#a9d3f0" position="1.4 1.7 -4.18"></a-plane>

  <!-- 출입문: 오른쪽 벽(침대 발치 쪽), 폭 0.9m · 높이 2.1m — 문틀·손잡이·창·하단 보호판 -->
  <a-entity id="door" position="3.19 0 0.25" rotation="0 -90 0">
    <a-box width="1.06" height="2.2" depth="0.04" color="#7d848c" position="0 1.1 -0.01"></a-box>
    <a-box width="0.9" height="2.1" depth="0.04" color="#c9a77c" position="0 1.05 0.012"></a-box>
    <a-plane width="0.22" height="0.6" color="#dfe9ef" position="-0.2 1.45 0.034"></a-plane>
    <a-plane width="0.86" height="0.22" color="#b9bec4" position="0 0.13 0.034"></a-plane>
    <a-box width="0.04" height="0.04" depth="0.05" color="#a7acb2" position="0.36 1.0 0.055"></a-box>
    <a-box width="0.15" height="0.025" depth="0.025" color="#c4c8cd" position="0.3 1.0 0.08"></a-box>
    <a-plane width="0.3" height="0.12" color="#2f6fb3" position="0 2.32 0.012"></a-plane>
  </a-entity>

  <!-- 손소독제(sanitizer.glb): 출입문 바로 옆 벽, 문과 세면대 사이 · 높이 약 1.2m -->
  <a-entity id="sanitizer" gltf-model="url(sanitizer.glb)" scale="0.13 0.13 0.13" position="3.118 1.2 -0.55" rotation="0 -90 0"></a-entity>

  <!-- 손씻기 구역: 세면대(sink.glb)를 오른쪽 벽에 붙임 — 문에서 약 0.7m 떨어져 문을 가리지 않음.
       세면대 윗면 높이 약 0.85m -->
  <a-entity id="sink" gltf-model="url(sink.glb)" scale="0.28 0.28 0.28" position="2.934 0.748 -1.0" rotation="0 -90 0"></a-entity>
  <!-- 손세정제(hand_soap.glb): 세면대 윗면 뒤쪽 모서리, 수도꼭지 옆 · 라벨이 사용자 쪽 -->
  <a-entity id="soap" gltf-model="url(hand_soap.glb)" scale="0.105 0.105 0.105" position="3.12 0.95 -1.09" rotation="0 -90 0"></a-entity>
  <!-- 페이퍼 타월 디스펜서(paper_towel.glb): 세면대 바로 위 벽 · 타월 나오는 곳 높이 약 1.25m -->
  <a-entity id="towel" gltf-model="url(paper_towel.glb)" scale="0.19 0.19 0.19" position="3.144 1.43 -1.0" rotation="0 -90 0"></a-entity>

  <!-- 침대 (bed.glb): 전동 병원침대, 길이 약 2.1m · 머리 쪽이 벽 · 매트리스 윗면 높이 약 0.59m
       bed-rails rightDown: true = 환자 오른쪽 난간 내려감 / false = 올라감 -->
  <a-entity id="bed" gltf-model="url(bed.glb)" bed-rails="rightDown: true" scale="1.104 1.104 1.104" position="0 0.411 -2.45" rotation="0 90 0"></a-entity>
  <!-- 베개: 볼록한 베개 + 흰 바탕에 작은 CAU 글씨가 반복된 병원 베갯잇 -->
  <a-sphere radius="1" scale="0.32 0.065 0.2" position="0 0.648 -3.17" segments-width="36" segments-height="18" pillowcase></a-sphere>

  <!-- 환자 (patient.glb) -->
  <a-entity id="patient" gltf-model="url(patient.glb)" pose-clip="time: 11.4"
            position="0 0.52 -2.6" rotation="0 0 0"></a-entity>

  <!-- 수액폴대 (iv_pole.glb, 높이 약 1.9m) — 침대 머리 쪽, 보는 사람 반대편 -->
  <a-entity id="ivpole" gltf-model="url(iv_pole.glb)" position="-0.8 0.95 -3.1" rotation="0 0 0"></a-entity>

  <!-- 폴대 고리 4개 위치 (수액폴대 모델에서 계산): 바닥에서 약 1.77m
       A(-1.09, -3.02)  B(-0.97, -3.37)  ← 보는 사람 쪽 /  C(-0.54, -3.02)  D(-0.70, -3.38) ← 침대 쪽 -->
  <!-- 수액백 (iv_bag.glb) — 고리 A에 걸림 -->
  <a-entity id="ivbag" gltf-model="url(iv_bag.glb)" scale="0.4 0.4 0.4" position="-1.09 1.39 -3.02" hang-on="-1.091 1.77 -3.016"></a-entity>

  <!-- PCA (pca.glb, 탄력식 통증조절기) — 수액백 옆 고리 B에 걸림 -->
  <a-entity id="pca" gltf-model="url(pca.glb)" scale="0.24 0.24 0.24" position="-0.97 1.54 -3.37" hang-on="-0.967 1.77 -3.373"></a-entity>

  <!-- 인퓨전펌프 (infusion_pump.glb) — 수액폴대에 클램프로 고정, 화면이 '폴대 쪽' 시점을 향함.
       화면: 20 mL/hr (처방 80 mL/hr → E4 오류). 화면을 클릭하면 80으로 교정 -->
  <a-entity id="pump" gltf-model="url(infusion_pump.glb)" scale="0.2 0.2 0.2" position="-0.756 0.95 -3.053" rotation="0 -52 0">
    <a-plane class="clickable" pump-screen="rate: 20; order: 80; fluid: Plasma 1L"
             width="0.36" height="0.27" position="0.235 0.43 0.356"></a-plane>
  </a-entity>

  <!-- 3-way (클릭 가능) -->
  <a-entity id="threeway" class="clickable"></a-entity>

  <!-- 수액 세트: 수액백 + PCA 라인이 3-way에서 합쳐져 환자 오른팔로 주입.
       pcaClosed: true = 3-way 손잡이가 PCA 쪽 → PCA 차단 (E5 오류) / false = 정상 -->
  <a-entity iv-set="bag: #ivbag; pca: #pca; patient: #patient; threeway: #threeway; pump: #pump; pcaClosed: true"></a-entity>

  <!-- 보는 사람: 시작 시점 = 폴대 쪽 (환자 오른편, 수액폴대·펌프·PCA·3-way가 잘 보임) -->
  <a-entity laser-controls="hand: right" raycaster="objects: .clickable"></a-entity>
  <a-entity id="rig" position="-2.2 0 -2.0" rotation="0 -52 0">
    <a-camera id="cam" position="0 1.55 0" look-controls wasd-controls="acceleration:20"></a-camera>
  </a-entity>
</a-scene>

<script>
let cur = document.getElementById('patient');
const sel = document.getElementById('target');
function load(){              // 고른 물건의 현재 위치를 막대에 불러옴
  cur = document.getElementById(sel.value);
  const vec = n => { const v = cur.getAttribute(n); return typeof v==='string' ? AFRAME.utils.coordinates.parse(v) : v; };
  const p = vec('position'), r = vec('rotation');
  px.value=p.x; py.value=p.y; pz.value=p.z; pr.value=r.y;
  document.getElementById('lt').style.display = sel.value==='patient' ? 'block' : 'none';
  upd();
}
function upd(){
  const y=+py.value, z=+pz.value, x=+px.value, r=+pr.value, t=+pt.value;
  vy.textContent=y.toFixed(2); vz.textContent=z.toFixed(2); vx.textContent=x.toFixed(2);
  vr.textContent=r+'°'; vt.textContent=t.toFixed(1);
  cur.setAttribute('position', x+' '+y+' '+z);
  cur.setAttribute('rotation', '0 '+r+' 0');
  let code = sel.options[sel.selectedIndex].text+': position="'+x.toFixed(2)+' '+y.toFixed(2)+' '+z.toFixed(2)+'" rotation="0 '+r+' 0"';
  if (sel.value==='patient') { cur.setAttribute('pose-clip','time',t); code += ' pose-clip="time: '+t.toFixed(1)+'"'; }
  document.getElementById('code').textContent = code;
}
['py','pz','px','pr','pt'].forEach(id => document.getElementById(id).addEventListener('input', upd));
sel.addEventListener('change', load);
function setView(x, z, yaw){    // 시점 바꾸기
  const rig = document.getElementById('rig'), lc = document.getElementById('cam').components['look-controls'];
  rig.setAttribute('position', x + ' 0 ' + z); rig.setAttribute('rotation', '0 ' + yaw + ' 0');
  document.getElementById('cam').setAttribute('position', '0 1.55 0');
  if (lc) { lc.yawObject.rotation.y = 0; lc.pitchObject.rotation.x = 0; }
}
window.onPatientPlaced = () => { if (sel.value === 'patient') load(); };
load();
document.getElementById('toggle').onclick = function(){
  const pn = document.getElementById('panel');
  const hide = pn.style.display !== 'none';
  pn.style.display = hide ? 'none' : 'block';
  this.textContent = hide ? '조절창 보이기' : '조절창 숨기기';
};
</script>
</body>
</html>
